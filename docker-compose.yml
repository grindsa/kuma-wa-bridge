services:
  kuma-wa-bridge:
    build: .
    image: ${IMAGE:-kuma-wa-bridge:latest}
    container_name: kuma-wa-bridge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
      WA_SRV: ${WA_SRV}
      WA_PORT: ${WA_PORT}
      WA_RECIPIENT: ${WA_RECIPIENT:-}
      WA_ADMIN_NUMBER: ${WA_ADMIN_NUMBER:-}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${HOST_PORT:-8089}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - pi-monitor

networks:
  pi-monitor:
    name: ${NETWORK_NAME:-pi-monitor}
    external: true
